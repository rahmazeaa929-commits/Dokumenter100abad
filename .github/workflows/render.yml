name: Render video

on:
  workflow_dispatch:
    inputs:
      composition:
        description: "Composition ID"
        default: "Dokumenter100Abad"
      output:
        description: "Nama file output"
        default: "100-tahun.mp4"

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Library Chrome headless
        run: |
          sudo apt-get update
          sudo apt-get install -y libnss3 libdbus-1-3 libatk1.0-0 libasound2t64 libxrandr2 libxkbcommon-dev libxfixes3 libxcomposite1 libxdamage1 libgbm-dev libatk-bridge2.0-0 libcups2 || true

      - name: Install dependensi
        run: npm ci

      - name: Cek tipe
        run: npx tsc --noEmit

      - name: Cek composition
        run: npx remotion compositions src/index.ts

      - name: Render still pratinjau
        run: |
          mkdir -p out
          npx remotion still src/index.ts "${{ inputs.composition }}" out/still-60.png --frame=60

      - name: Render video penuh
        run: >
          npx remotion render src/index.ts "${{ inputs.composition }}" "out/${{ inputs.output }}"
          --codec=h264 --audio-codec=aac --crf=20 --concurrency=2

      - name: Verifikasi hasil
        run: ffprobe -v error -show_entries format=duration:stream=codec_name,width,height,r_frame_rate -of default=nw=1 "out/${{ inputs.output }}"

      - uses: actions/upload-artifact@v4
        with:
          name: video-hasil
          path: out/
