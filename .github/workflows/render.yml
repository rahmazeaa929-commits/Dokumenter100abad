name: Render video

on:
  workflow_dispatch:
    inputs:
      composition:
        description: "Composition ID"
        default: "Dokumenter100Abad"
      output:
        description: "Nama file output"
        default: "100-tahun.mp4"

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Ekstrak ZIP proyek
        run: |
          unzip -q 100-tahun-remotion.zip
          ls proj

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Library Chrome headless
        run: |
          sudo apt-get update
          sudo apt-get install -y libnss3 libdbus-1-3 libatk1.0-0 libasound2t64 libxrandr2 libxkbcommon-dev libxfixes3 libxcomposite1 libxdamage1 libgbm-dev libatk-bridge2.0-0 libcups2 || true

      - name: Install dependensi
        working-directory: proj
        run: npm ci

      - name: Cek tipe
        working-directory: proj
        run: npx tsc --noEmit

      - name: Cek composition
        working-directory: proj
        run: npx remotion compositions src/index.ts

      - name: Render still pratinjau
        working-directory: proj
        run: |
          mkdir -p out
          npx remotion still src/index.ts "${{ inputs.composition }}" out/still-60.png --frame=60

      - name: Render video penuh
        working-directory: proj
        run: >
          npx remotion render src/index.ts "${{ inputs.composition }}" "out/${{ inputs.output }}"
          --codec=h264 --audio-codec=aac --crf=26 --concurrency=2

      - name: Unggah hasil (langsung setelah render)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: video-hasil
          path: proj/out/
          compression-level: 0
          if-no-files-found: warn

      - name: Info file hasil (tidak menggagalkan job)
        if: always()
        continue-on-error: true
        working-directory: proj
        run: |
          ls -lh out/ || true
          npx remotion ffprobe "out/${{ inputs.output }}" || true
